version: '3.9'

services:
  flask-app:
    build: .
    container_name: flask_youtube_app
    expose:
      - "5000"
    networks:
      - appnet
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "8081:8081"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flask-app
    networks:
      - appnet
    restart: unless-stopped

networks:
  appnet:

