name: Auto Tag on Merge to Main

on:
  pull_request:
    types: [closed]
    branches:
      - Main

jobs:
  create_tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar el repositorio con todo el historial
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Obtener el último tag o usar v0.0.0 si no hay
      - name: Get latest tag
        id: get_tag
        run: |
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT

      # 3️⃣ Incrementar patch y generar nuevo tag
      - name: Bump version
        id: bump_version
        run: |
          version="${LATEST_TAG#v}"
          IFS='.' read -r major minor patch <<< "$version"
          patch=$((patch + 1))
          new_tag="v${major}.${minor}.${patch}"
          echo "new_tag=$new_tag" >> $GITHUB_OUTPUT
        env:
          LATEST_TAG: ${{ steps.get_tag.outputs.latest_tag }}

      # 4️⃣ Crear y subir el tag al repositorio
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.bump_version.outputs.new_tag }}
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ${{ steps.bump_version.outputs.new_tag }}
