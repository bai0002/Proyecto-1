name: Auto Tag on Merge to Main (Windows)

on:
  pull_request:
    types: [closed]
    branches:
      - Main

jobs:
  create_tag:
    if: github.event.pull_request.merged == true
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: get_tag
        shell: pwsh
        run: |
          try {
              $latest_tag = git describe --tags --abbrev=0
          } catch {
              $latest_tag = "v0.0.0"
          }
          "latest_tag=$latest_tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Bump version
        id: bump_version
        shell: pwsh
        run: |
          $version = $env:LATEST_TAG.TrimStart('v')
          $parts = $version.Split('.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2] + 1
          $new_tag = "v$major.$minor.$patch"
          "new_tag=$new_tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        env:
          LATEST_TAG: ${{ steps.get_tag.outputs.latest_tag }}

      - name: Create and push tag
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $env:NEW_TAG
          git push origin $env:NEW_TAG
        env:
          NEW_TAG: ${{ steps.bump_version.outputs.new_tag }}
