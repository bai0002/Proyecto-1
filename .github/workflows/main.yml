name: Auto Tag on Merge to Main

on:
  pull_request:
    types: [closed]   # Se dispara cuando se cierra un PR
    branches:
      - main          # Solo PRs hacia main

jobs:
  create_tag:
    if: github.event.pull_request.merged == true  # Solo si el PR fue mergeado
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar el repositorio con todo el historial (necesario para tags)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Obtener el último tag (o v0.0.0 si no hay)
      - name: Get latest tag
        id: get_tag
        run: |
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT

      # 3️⃣ Incrementar la versión patch
      - name: Bump version
        id: bump_version
        run: |
          version="${LATEST_TAG#v}"
          IFS='.' read -r major minor patch <<< "$version"
          patch=$((patch + 1))
          new_tag="v${major}.${minor}.${patch}"
          echo "new_tag=$new_tag" >> $GITHUB_OUTPUT
        env:
          LATEST_TAG: ${{ steps.get_tag.outputs.latest_tag }}

      # 4️⃣ Crear y pushear el nuevo tag
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.bump_version.outputs.new_tag }}
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ${{ steps.bump_version.outputs.new_tag }}

      # 5️⃣ Crear una Release en GitHub (opcional)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump_version.outputs.new_tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
